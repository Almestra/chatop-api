spring.application.name=chatop-api

# Local environment file (.env), ignored by Git
spring.config.import=optional:file:.env[.properties]

# Server (port expected by the Angular proxy)
server.port=3001

# Database, with credentials read from the environment
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA: the schema is managed by docs/database.sql, never by Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false

# JWT: signing secret read from the environment, token lifetime
jwt.secret=${JWT_SECRET}
jwt.expiration=24h

# Messages: always in English, whatever the client's language
spring.web.locale=en
spring.web.locale-resolver=fixed

# Pictures: folder of the uploaded files, relative to the working directory, ignored by Git
images.directory=uploads

# Pictures: start of the URLs saved with the rentals, followed by the file name
images.base-url=http://localhost:3001/api/images

# Uploads: 5 MB at most per file (Spring Boot allows 1 MB by default)
spring.servlet.multipart.max-file-size=5MB

spring.application.name=chatop-api

# Local environment file (.env), ignored by Git
spring.config.import=optional:file:.env[.properties]

# Server (port expected by the Angular proxy)
server.port=3001

# Database, with credentials read from the environment
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA: the schema is managed by docs/database.sql, never by Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
